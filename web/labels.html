<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR 標籤列印</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { padding-bottom: 24px; }
    .labels { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .label {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 10px; border: 1px dashed var(--border); border-radius: 8px;
      background: #fff; color: #000; text-align: center; break-inside: avoid;
    }
    .label .qr { width: 120px; height: 120px; }
    .label .qr img, .label .qr canvas { width: 100% !important; height: 100% !important; }
    .label .id { font: 700 18px ui-monospace, Consolas, monospace; }
    .label .name { font-size: 12px; line-height: 1.3; overflow-wrap: anywhere; }
    .pick { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .pick input { width: auto; min-height: 0; }
    .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px; max-height: 240px; overflow-y: auto; }
    @media print {
      @page { margin: 10mm; }
      body { background: #fff; padding: 0; }
      .no-print { display: none !important; }
      .container { max-width: none; padding: 0; }
      .labels { grid-template-columns: repeat(4, 1fr); gap: 6mm; }
      .label { border-color: #999; }
    }
  </style>
</head>
<body>
  <header class="topbar no-print"><a href="./#/admin" class="brand">← QR 標籤列印</a></header>
  <main class="container">
    <section class="card no-print" id="controls">
      <p class="empty">載入中…</p>
    </section>
    <div class="labels" id="labels"></div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module" src="js/labels.js"></script>
</body>
</html>
