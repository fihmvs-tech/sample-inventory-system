# 把 web/ 部署到 GitHub Pages；apps-script/*.gs 一併複製成 js/demo/gas/*.js 供示範模式使用。
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'apps-script/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          mkdir -p _site/js/demo/gas
          for f in apps-script/*.gs; do
            cp "$f" "_site/js/demo/gas/$(basename "${f%.gs}").js"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
